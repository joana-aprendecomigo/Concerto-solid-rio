<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Concerto Solidário · YME</title>

    <!-- Favicons gerados a partir do logótipo da YME (variante escura, legível
         sobre o separador claro do browser). -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0F172B" />

    <!-- Instalação no iPhone: o Safari ignora o manifest e precisa destas
         etiquetas para abrir sem a barra do browser. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Concerto" />
    <meta name="description" content="Gestão de relações externas do concerto solidário a favor do IPO." />
    <style>
      /* O componente desenha o seu próprio fundo e ocupa a altura toda da
         janela; sem isto, as margens por omissão do browser deixam faixas
         brancas à volta. */
      html, body, #root {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      body {
        background: #0F172B;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
